# SonarQube Cloud analysis, run from the "sonar" job in .github/workflows/ci.yml.
# The coverage report is produced by the test job (cargo llvm-cov --lcov) and downloaded before the scan.
sonar.projectKey=memearr_softver
sonar.organization=memearr

sonar.sources=.
sonar.exclusions=target/**
sonar.test.inclusions=tests/**
sonar.coverage.exclusions=tests/**,examples/**

sonar.rust.lcov.reportPaths=lcov.info
